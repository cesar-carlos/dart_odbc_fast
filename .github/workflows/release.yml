name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g.: v1.1.0)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write # Required for OIDC authentication

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_version: ${{ steps.meta.outputs.release_version }}
    env:
      CI: "true"
      ENABLE_E2E_TESTS: "0"
      RUN_SKIPPED_TESTS: "0"
      ODBC_TEST_DSN: ""
      ODBC_DSN: ""

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Validate release metadata (tag/pubspec/changelog)
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "Invalid tag: ${TAG}. Use format vX.Y.Z (or suffix -rc.N/-beta.N/-dev.N)."
            exit 1
          fi

          VERSION="$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')"
          if [[ -z "${VERSION}" ]]; then
            echo "Could not read version from pubspec.yaml"
            exit 1
          fi

          if [[ "v${VERSION}" != "${TAG}" ]]; then
            echo "Inconsistency: pubspec.yaml=${VERSION}, tag=${TAG}"
            exit 1
          fi

          if ! grep -q "^## \\[${VERSION}\\]" CHANGELOG.md; then
            echo "CHANGELOG.md missing section for [${VERSION}]"
            exit 1
          fi

          echo "release_tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> target

      - name: Install ODBC (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev libclang-dev llvm

      - name: Install dependencies
        run: dart pub get

      - name: Build Rust library (host)
        run: |
          cd native
          cargo build --release --verbose

      - name: Rust format check
        run: |
          cd native
          cargo fmt --all -- --check

      - name: Dart analyze
        run: dart analyze

      - name: Check FFI export surfaces
        run: dart tool/check_ffi_exports.dart

      - name: Dart tests (unit-only, no integration/e2e/stress)
        run: >
          dart test
          test/application
          test/domain
          test/infrastructure
          test/helpers/database_detection_test.dart

      - name: Rust lint (clippy)
        run: |
          cd native
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (lib only)
        run: |
          cd native
          cargo test -p odbc_engine --lib -- --test-threads=1

  build-binaries:
    needs: verify
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: libodbc_engine.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: odbc_engine.dll

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.verify.outputs.release_tag }}

      - name: Setup Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> target

      - name: Install ODBC (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev libclang-dev llvm

      - name: Build Rust library
        run: |
          cd native
          echo "Building for target: ${{ matrix.target }}"
          cargo build --release --target ${{ matrix.target }} --verbose
        shell: bash

      - name: Rename artifact
        run: |
          mkdir -p uploads
          cp native/target/${{ matrix.target }}/release/${{ matrix.artifact }} \
             uploads/${{ matrix.artifact }}
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: uploads/${{ matrix.artifact }}
          retention-days: 1

  test-windows:
    needs: [verify, build-binaries]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "true"
      ODBC_FAST_PREFER_LOCAL_BUILD: "true"
      ODBC_FAST_SKIP_DOWNLOAD: "true"
      ODBC_TEST_DSN: ""
      ODBC_DSN: ""

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.verify.outputs.release_tag }}

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Download Windows DLL
        uses: actions/download-artifact@v7
        with:
          name: odbc_engine.dll
          path: native/target/release/

      - name: Install dependencies
        run: dart pub get

      - name: Dart tests (unit-only, Windows)
        run: >
          dart test
          test/application
          test/domain
          test/infrastructure
          test/helpers/database_detection_test.dart
          --concurrency=4

  create-release:
    needs: [verify, build-binaries, test-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: refs/tags/${{ needs.verify.outputs.release_tag }}

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: uploads/
          pattern: "*"
          merge-multiple: true

      - name: Validate downloaded artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f uploads/odbc_engine.dll
          test -f uploads/libodbc_engine.so

      - name: Extract CHANGELOG section into release body
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.release_version }}
        run: |
          set -euo pipefail
          python3 - "${VERSION}" > CHANGELOG_SECTION.md <<'PY'
          import re
          import sys

          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          header = re.search(
              r"^## \[" + re.escape(version) + r"\][^\n]*\n",
              text,
              re.MULTILINE,
          )
          if not header:
              sys.exit(f"CHANGELOG.md missing section for [{version}]")
          start = header.end()
          nxt = re.search(r"^## \[", text[start:], re.MULTILINE)
          end = start + nxt.start() if nxt else len(text)
          print(text[start:end].strip())
          PY
          echo "----- Release body preview (head) -----"
          head -n 40 CHANGELOG_SECTION.md
          echo "----- end preview -----"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.verify.outputs.release_tag }}
          name: Release ${{ needs.verify.outputs.release_tag }}
          body_path: CHANGELOG_SECTION.md
          append_body: true
          files: uploads/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(needs.verify.outputs.release_tag, '-rc.') || contains(needs.verify.outputs.release_tag, '-beta.') || contains(needs.verify.outputs.release_tag, '-dev.') }}
          draft: false
