name: CI

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      ENABLE_E2E_TESTS: "0"
      RUN_SKIPPED_TESTS: "0"
      RUN_LIVE_TESTS: "0"
      RUN_STRESS_TESTS: "0"
      RUN_PERF_TESTS: "0"
      ODBC_TEST_DSN: ""
      ODBC_DSN: ""
      ODBC_EXAMPLE_DISABLE_DSN: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> target

      - name: Install ODBC (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev libclang-dev llvm

      - name: Rust format check
        run: |
          cd native
          cargo fmt --all -- --check

      - name: Rust lint (clippy)
        run: |
          cd native
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Rust library
        run: |
          cd native
          cargo build --release --verbose

      - name: Build benchmarks
        run: |
          cd native
          cargo build --release --benches

      - name: Build with sqlserver-bcp feature
        run: |
          cd native
          cargo build --release --features sqlserver-bcp

      - name: Build with block-cursor-fetch feature
        run: |
          cd native
          cargo build --release --features block-cursor-fetch

      - name: Build with statement-handle-reuse feature
        run: |
          cd native
          cargo build --release --features statement-handle-reuse

      - name: Run Rust tests
        run: |
          cd native
          cargo test --workspace -- --test-threads=1

      - name: Run Rust tests with block-cursor-fetch feature
        run: |
          cd native
          cargo test --workspace --features block-cursor-fetch -- --test-threads=1

      - name: Run Rust tests with statement-handle-reuse feature
        run: |
          cd native
          cargo test --workspace --features statement-handle-reuse -- --test-threads=1

      - name: Install Dart dependencies
        run: dart pub get

      - name: Dart analyze
        run: dart analyze

      - name: Check FFI export surfaces
        run: dart tool/check_ffi_exports.dart

      - name: Run Dart tests (unit-only, no integration/e2e/stress)
        run: >
          dart test
          test/application
          test/domain
          test/infrastructure
          test/helpers/database_detection_test.dart

      - name: Run docs and opt-in example smoke tests
        run: dart test test/documentation test/example

      - name: Dart protocol performance guard (no DSN)
        run: dart test test/performance/protocol_performance_test.dart

      - name: Dart slow-test budget
        run: >
          dart run tool/test_slow_report.dart
          --top 20
          --threshold-ms 500
          --fail-threshold-ms 1500
          --
          test/application
          test/domain
          test/infrastructure
          test/helpers/database_detection_test.dart

  loom:
    # Optional, non-blocking loom exploration of the FFI state lock
    # interactions (sprint 4 follow-up C11). Runs in its own job because
    # `--cfg loom` is incompatible with normal cargo test caching and
    # the model-check is slow.
    #
    # The loom models live in the dedicated `loom_models` workspace
    # member (see `native/loom_models/`) — building them through
    # `odbc_engine` would drag in `tokio`, which is not loom-compatible
    # (see tokio-rs/tokio#2510). `cargo test -p loom_models` keeps the
    # build scoped to `loom` + `std`.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      CI: "true"
      RUSTFLAGS: "--cfg loom"
    steps:
      - uses: actions/checkout@v5
      - name: Setup Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
      - name: Run loom models
        run: |
          cd native
          cargo test -p loom_models --release -- --test-threads=1

  coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      ENABLE_E2E_TESTS: "0"
      RUN_SKIPPED_TESTS: "0"
      RUN_LIVE_TESTS: "0"
      RUN_STRESS_TESTS: "0"
      RUN_PERF_TESTS: "0"
      ODBC_TEST_DSN: ""
      ODBC_DSN: ""
      ODBC_EXAMPLE_DISABLE_DSN: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> target

      - name: Install ODBC (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev libclang-dev llvm

      - name: Build Rust library (required for Dart FFI)
        run: |
          cd native
          cargo build --release

      - name: Install Dart dependencies
        run: dart pub get

      - name: Activate coverage tool
        run: dart pub global activate coverage

      - name: Run Dart tests with coverage
        run: >
          dart test --coverage=coverage
          test/application
          test/domain
          test/infrastructure
          test/core
          test/helpers/database_detection_test.dart

      - name: Format Dart coverage as LCOV
        run: >
          dart pub global run coverage:format_coverage
          --lcov
          --in=coverage
          --out=coverage/lcov.info
          --packages=.dart_tool/package_config.json
          --report-on=lib

      - name: Upload Dart coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: dart
          name: dart-coverage
          disable_search: true
          fail_ci_if_error: true

      - name: Upload Dart coverage report
        uses: actions/upload-artifact@v7
        with:
          name: dart-coverage-report
          path: coverage/

      - name: Rust coverage (lib + tests)
        run: |
          cd native
          cargo install --locked cargo-tarpaulin
          cargo tarpaulin -p odbc_engine --lib --tests --timeout 600 --out Html --out Lcov --output-dir coverage -- --test-threads=1

      - name: Upload Rust coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: native/coverage/lcov.info
          flags: rust
          name: rust-coverage
          disable_search: true
          fail_ci_if_error: true

      - name: Upload Rust coverage report
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage-report
          path: native/coverage/
