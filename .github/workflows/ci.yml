name: CI

"on":
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      ENABLE_E2E_TESTS: "0"
      RUN_SKIPPED_TESTS: "0"
      RUN_LIVE_TESTS: "0"
      RUN_STRESS_TESTS: "0"
      RUN_PERF_TESTS: "0"
      ODBC_TEST_DSN: ""
      ODBC_DSN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Setup Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> target

      - name: Install ODBC (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev libclang-dev llvm

      - name: Rust format check
        run: |
          cd native
          cargo fmt --all -- --check

      - name: Rust lint (clippy)
        run: |
          cd native
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Build Rust library
        run: |
          cd native
          cargo build --release --verbose

      - name: Build benchmarks
        run: |
          cd native
          cargo build --release --benches

      - name: Build with sqlserver-bcp feature
        run: |
          cd native
          cargo build --release --features sqlserver-bcp

      - name: Run Rust tests
        run: |
          cd native
          cargo test --workspace -- --test-threads=1

      - name: Install dependencies
        run: dart pub get

      - name: Dart analyze
        run: dart analyze

      - name: Check FFI export surfaces
        run: dart run tool/check_ffi_exports.dart

      - name: Run Dart tests (unit-only, no integration/e2e/stress)
        run: >
          dart test
          test/application
          test/domain
          test/infrastructure
          test/helpers/database_detection_test.dart

      - name: Dart protocol performance guard (no DSN)
        run: dart test test/performance/protocol_performance_test.dart

      - name: Dart slow-test budget
        run: >
          dart run tool/test_slow_report.dart
          --top 20
          --threshold-ms 500
          --fail-threshold-ms 1500
          --
          test/application
          test/domain
          test/infrastructure
          test/helpers/database_detection_test.dart

  coverage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      ENABLE_E2E_TESTS: "0"
      RUN_SKIPPED_TESTS: "0"
      RUN_LIVE_TESTS: "0"
      RUN_STRESS_TESTS: "0"
      RUN_PERF_TESTS: "0"
      ODBC_TEST_DSN: ""
      ODBC_DSN: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (pinned toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            native -> target

      - name: Install ODBC (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev libclang-dev llvm

      - name: Rust coverage (lib + tests)
        run: |
          cd native
          cargo install --locked cargo-tarpaulin
          cargo tarpaulin -p odbc_engine --lib --tests --timeout 600 --out Html --out Lcov --output-dir coverage -- --test-threads=1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: native/coverage/lcov.info
          flags: rust
          name: rust-coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-report
          path: native/coverage/
