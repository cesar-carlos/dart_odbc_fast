[package]
name = "odbc_engine"
version = "3.9.0"
edition = "2021"
authors = ["ODBC Fast Team"]
description = "Enterprise-grade ODBC data platform engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/odbc-fast/dart_odbc_fast"
build = "build.rs"
keywords = ["odbc", "database", "sql", "ffi", "dart"]
categories = ["database", "api-bindings"]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# `block-cursor-fetch` and `statement-handle-reuse` graduated to default in
# the engine-perf follow-up cycle: the CI matrix now exercises every
# feature combination on each PR and the synthetic Criterion benches
# under `benches/` confirm the speedups without regressions. Consumers
# that need to opt out can build with
# `default-features = false, features = ["observability"]`.
# `test-helpers` is dev/test-only: integration tests and benches that need
# `load_dotenv` declare `required-features = ["test-helpers"]`.
default = [
    "observability",
    "block-cursor-fetch",
    "statement-handle-reuse",
]
sqlserver-bcp = ["dep:libloading"]
# Reuse ODBC prepared statement handles per connection (LRU cache).
# Promoted to default — see comment on `default` above.
statement-handle-reuse = []
# Full observability: OTLP exporter, metrics, tracing. Disable for minimal builds.
observability = ["dep:ureq"]
# Load .env in library and integration tests.
test-helpers = ["dep:dotenvy"]
# Enables FFI tests whose symbols may not be visible in every build config.
ffi-tests = []
# XA / 2PC on SQL Server via MSDTC. No-op on non-Windows targets.
xa-dtc = ["dep:windows"]
# XA / 2PC on Oracle through a dynamically loaded OCI XA library.
xa-oci = ["dep:libloading"]
# EXPERIMENTAL — not in `default` features. Opt-in only.
# `columnar-v2` gates `protocol::columnar_v2` (sketch header constants) and the
# `columnar_v2_placeholder` bench. Production columnar encoding (`protocol::columnar`,
# `ColumnarEncoder`, `odbc_columnar_decompress`) stays on the default build.
# Full sketch emitter/parser is not production-ready; see
# `src/protocol/columnar_v2.rs` and `doc/notes/columnar_protocol_sketch.md`.
# Enabling this feature emits a `cargo:warning` from `build.rs`.
columnar-v2 = []
# Use BlockCursor + ColumnarAnyBuffer to fetch result sets in batches instead
# of `cursor.next_row()` one cell at a time. Promoted to default — see
# comment on `default` above. Coexists with the legacy per-row fetch
# (cell_reader path) so any driver/schema that can't be expressed as a
# bound columnar buffer (LOBs, WLONGVARCHAR without a known max width)
# automatically falls back.
block-cursor-fetch = []

[dependencies]
odbc-api = { version = "20.1.1", default-features = false, features = ["odbc_version_3_5"] }
r2d2 = "0.8"
rayon = "1.8"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread"] }
thiserror = "2.0"
log = "0.4"
lru = "0.12"
zeroize = { version = "1.7", features = ["zeroize_derive"] }
lazy_static = "1.5"
libc = "0.2"
zstd = "0.13"
lz4 = "1.24"
ureq = { version = "2.9", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = { version = "0.15", optional = true }
# Oracle OCI XA dynamic-loading shim.
libloading = { version = "0.8", optional = true }

[target.'cfg(windows)'.dependencies]
# MSDTC COM enlistment uses the `windows` crate for generated COM interfaces.
windows = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DistributedTransactionCoordinator",
    "Win32_System_Variant",
], optional = true }

[dev-dependencies]
env_logger = "0.11"
criterion = { version = "0.5", features = ["html_reports"] }
serial_test = "3"
# Loom was previously a dev-dependency here, but `odbc_engine` pulls in
# `tokio` which is not loom-compatible (its `AtomicWaker` exports are
# gated behind `#[cfg(not(loom))]` while `task::local` uses them
# unconditionally — see tokio-rs/tokio#2510). The loom models now live
# in the sibling `loom_models` workspace member, which does not depend
# on `odbc_engine` or `tokio` and can therefore be built with
# `RUSTFLAGS="--cfg loom"`. See
# `native/loom_models/tests/loom_state_test.rs` for the models.

[[test]]
name = "ffi_compatibility_test"
path = "tests/ffi_compatibility_test.rs"
required-features = ["ffi-tests"]

# All integration tests below pull in `tests/helpers/e2e.rs`, which calls
# `odbc_engine::test_helpers::load_dotenv` to bootstrap DSN env vars.
# That helper only exists when the `test-helpers` feature is enabled, so
# the targets must list it as required — otherwise `--no-default-features`
# builds break with an `unresolved import test_helpers` error chain.
# (Engine perf follow-up: lint cleanup; see CHANGELOG entry under PR1.3
# bookkeeping.)
[[test]]
name = "transaction_test"
required-features = ["test-helpers"]

