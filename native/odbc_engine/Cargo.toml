[[bench]]
name = "bulk_operations_bench"
harness = false
# `streaming_copy_next_chunk` uses `StreamingState::from_bytes_for_benchmark`,
# which is only compiled with the `test-helpers` feature.
required-features = ["test-helpers"]

[[bench]]
name = "metadata_cache_bench"
harness = false

[[bench]]
name = "comparative_bench"
harness = false
# `comparative_bench` resolves SQL Server DSN env vars via `load_dotenv`,
# the test-helpers feature provides it.
required-features = ["test-helpers"]

[[bench]]
name = "columnar_v2_placeholder"
harness = false
required-features = ["columnar-v2"]

[[bench]]
name = "columnar_v1_v2_encode"
